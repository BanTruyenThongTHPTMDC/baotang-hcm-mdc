<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Quản trị – Không gian văn hóa Hồ Chí Minh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <!-- ĐĂNG NHẬP (chỉ dùng khi chạy trên máy chủ trường) -->
  <section class="login" id="loginScreen" hidden>
    <form class="login-card" id="loginForm">
      <div class="login-emblem">★</div>
      <h1>Quản trị<br>Không gian văn hóa Hồ Chí Minh</h1>
      <div id="loginNormal">
        <label>Mật khẩu quản trị
          <input type="password" id="loginPassword" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn btn-primary btn-big">Đăng nhập</button>
      </div>
      <div id="loginSetup" hidden>
        <p class="hint">Lần đầu sử dụng: nhập <strong>mã cài đặt</strong> do bộ phận kỹ thuật cung cấp, sau đó đặt mật khẩu quản trị.</p>
        <label>Mã cài đặt <input id="setupCode" autocomplete="off"></label>
        <label>Mật khẩu mới (tối thiểu 8 ký tự) <input type="password" id="setupPass1" autocomplete="new-password"></label>
        <label>Nhập lại mật khẩu mới <input type="password" id="setupPass2" autocomplete="new-password"></label>
        <button type="submit" class="btn btn-primary btn-big">Đặt mật khẩu và vào trang quản trị</button>
      </div>
      <p class="form-error" id="loginError" role="alert"></p>
      <a href="index.html" class="back-link">← Về trang Không gian văn hóa</a>
    </form>
  </section>

  <!-- KHUNG QUẢN TRỊ -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="topbar-title">
        <span class="emblem">★</span>
        <div>
          <strong>Trang quản trị</strong>
          <span>Không gian văn hóa Hồ Chí Minh</span>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="save-state" id="saveState">Đã lưu</span>
        <a class="btn btn-light" id="btnPreview" href="index.html" target="_blank" rel="noopener">👁 Xem trang</a>
        <button type="button" class="btn btn-gold btn-save" id="btnSave">💾 Lưu thay đổi</button>
        <button type="button" class="btn btn-light" id="btnLogout" hidden>Đăng xuất</button>
      </div>
    </header>
    <div class="mode-banner" id="modeBanner" hidden></div>

    <div class="layout">
      <nav class="sidebar" id="sidebar" aria-label="Mục quản trị"></nav>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Hộp xác nhận lớn, dễ đọc -->
  <div class="dialog" id="dialog" hidden>
    <div class="dialog-box" role="alertdialog" aria-modal="true" aria-labelledby="dialogText">
      <p id="dialogText"></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-light btn-big" id="dialogNo">Không</button>
        <button type="button" class="btn btn-primary btn-big" id="dialogYes">Đồng ý</button>
      </div>
    </div>
  </div>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/qr.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
