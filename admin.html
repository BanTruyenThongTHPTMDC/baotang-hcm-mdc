<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bàn Xây Dựng Bảo Tàng Số (No-Code Studio) | Không Gian Văn Hóa Hồ Chí Minh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&family=Noto+Serif:ital,wght@0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    body.studio-standalone {
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #100504;
    }

    .studio-topbar {
      height: 62px;
      background: linear-gradient(90deg, #54090d 0%, #2b0908 55%, #180605 100%);
      border-bottom: 1.5px solid var(--gold-primary);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-shrink: 0;
    }

    .studio-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .studio-brand-badge {
      background: var(--gold-bright);
      color: var(--bg-obsidian);
      font-weight: 800;
      font-size: 0.72rem;
      padding: 0.22rem 0.55rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .studio-workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 540px 1fr;
      overflow: hidden;
    }

    .studio-editor-col {
      background: #160705;
      border-right: 2px solid var(--gold-primary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .studio-preview-col {
      background: #0b0302;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .preview-toolbar {
      padding: 0.6rem 1.2rem;
      background: #140605;
      border-bottom: 1px solid var(--gold-border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-light-muted);
    }

    .preview-frame-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
      overflow: hidden;
    }

    #livePreviewIframe {
      width: 100%;
      height: 100%;
      border: 1.5px solid var(--gold-muted);
      border-radius: 10px;
      background: var(--bg-obsidian);
      transition: width 0.3s ease;
    }

    #livePreviewIframe.mobile-view {
      width: 412px;
      max-width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
    }

    @media (max-width: 1100px) {
      .studio-workspace {
        grid-template-columns: 1fr;
      }

      .studio-preview-col {
        display: none;
      }
    }
  </style>
</head>

<body class="studio-standalone">

  <!-- THANH CÔNG CỤ STUDIO TRÊN CÙNG -->
  <header class="studio-topbar">
    <div class="studio-brand">
      <span class="studio-brand-badge">NO-CODE MUSEUM BUILDER</span>
      <h1 style="font-family: var(--font-serif); font-size: 1.15rem; color: var(--gold-light);">
        Bàn Xây Dựng & Quản Trị Không Gian Văn Hóa Hồ Chí Minh
      </h1>
    </div>

    <div style="display: flex; align-items: center; gap: 0.65rem;">
      <button type="button" class="cms-btn-sm" onclick="exportMuseumJson()">
        💾 Xuất File Dự Án (.json)
      </button>
      <button type="button" class="cms-btn-sm" onclick="resetToDefaultMuseum()" title="Khôi phục về bản gốc">
        🔄 Khôi phục Mặc định
      </button>
      <a href="index.html" class="btn-primary" style="padding: 0.48rem 1.1rem; font-size: 0.82rem;">
        🏛️ Mở Trang Bảo Tàng Chính Thức ↗
      </a>
    </div>
  </header>

  <!-- KHÔNG GIAN LÀM VIỆC 2 CỘT: TRÌNH DỰNG NO-CODE (TRÁI) & XEM TRƯỚC TRỰC TIẾP (PHẢI) -->
  <main class="studio-workspace">
    <!-- Cột Trái: Công cụ Chỉnh sửa Không cần Code -->
    <section class="studio-editor-col">
      <div class="cms-tabs-nav" id="cmsTabsNav">
        <button type="button" class="cms-tab-btn active" data-tab="general">1. Đảng Bộ & Sảnh</button>
        <button type="button" class="cms-tab-btn" data-tab="walls">2. Phòng 360° (4 Vách)</button>
        <button type="button" class="cms-tab-btn" data-tab="timeline">3. Biên Niên Sử</button>
        <button type="button" class="cms-tab-btn" data-tab="artifacts">4. Hiện Vật & Ảnh</button>
        <button type="button" class="cms-tab-btn" data-tab="interactive">5. Câu Hỏi & Sổ Vàng</button>
        <button type="button" class="cms-tab-btn" data-tab="publish">6. Xuất Bản</button>
      </div>

      <div id="cmsStudioBody" class="cms-body"></div>

      <div class="cms-footer">
        <span style="font-size: 0.76rem; color: var(--gold-light);">
          ⚡ Tự động đồng bộ sang màn hình Xem trước bên phải
        </span>
        <button type="button" class="btn-primary" style="padding: 0.5rem 1.1rem; font-size: 0.82rem;"
          onclick="saveMuseumState(true)">
          ✔ Lưu Thay Đổi & Cập Nhật Preview
        </button>
      </div>
    </section>

    <!-- Cột Phải: Màn hình Xem trước Thời gian thực -->
    <section class="studio-preview-col">
      <div class="preview-toolbar">
        <div>
          🟢 <strong>Màn hình Xem trước Trực tiếp (Live Preview)</strong> – Bạn có thể tương tác, xoay 360° ngay bên
          dưới
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button type="button" class="cms-btn-sm" onclick="setPreviewMode('desktop')">💻 Máy tính</button>
          <button type="button" class="cms-btn-sm" onclick="setPreviewMode('mobile')">📱 Điện thoại</button>
          <button type="button" class="cms-btn-sm" onclick="refreshPreviewIframe()">🔄 Làm mới</button>
        </div>
      </div>
      <div class="preview-frame-wrap">
        <iframe id="livePreviewIframe" src="index.html" title="Xem trước Bảo tàng Số"></iframe>
      </div>
    </section>
  </main>

  <!-- MODAL XEM TRƯỚC MÃ QR KỆ TRƯNG BÀY TRONG ADMIN -->
  <div id="artifactModal" class="modal-backdrop" onclick="if(event.target === this) closeArtifactModal()">
    <div class="modal-content">
      <button class="modal-close" onclick="closeArtifactModal()" title="Đóng">✕</button>
      <div id="modalBodyContent"></div>
    </div>
  </div>

  <div id="cmsToast" class="cms-toast">✔ Đã lưu và đồng bộ Bảo tàng Số!</div>

  <script src="app.js"></script>
  <script>
    function setPreviewMode(mode) {
      const frame = document.getElementById('livePreviewIframe');
      if (!frame) return;
      frame.classList.toggle('mobile-view', mode === 'mobile');
    }
    function refreshPreviewIframe() {
      const frame = document.getElementById('livePreviewIframe');
      if (frame && frame.contentWindow) {
        frame.contentWindow.location.reload();
      }
    }
  </script>
</body>

</html>
